<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 650" role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>South Lebanon: olive groves, terraced fields, hills and the sea</title>
  <!--
    The homepage cover, in the جنوبنا mark's own palette and motifs: the deep
    forest green of the ring, the gold of the wheat, the terracotta of the
    sheltering hand, the blue of the sea beneath the hills.

    Vector, not the 272 KB PNG it replaces — a full-bleed band on a phone over
    mobile data should cost a few kilobytes, and it stays sharp on any screen.

    Deliberately wordless. The slogan band directly below it carries the words
    now, where they can be translated and read aloud; text baked into a
    decorative image can be neither.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf6"/>
      <stop offset="0.55" stop-color="#faf3ea"/>
      <stop offset="1" stop-color="#f3e6d3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b82b8"/>
      <stop offset="1" stop-color="#1c6ea4"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d786"/>
      <stop offset="1" stop-color="#e8ae1f"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="650" fill="url(#sky)"/>

  <!-- Sun, low and warm, echoing the mark -->
  <g transform="translate(1480 175)">
    <circle r="62" fill="#f9b723"/>
    <g stroke="#f9b723" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-96" x2="0" y2="-124"/>
      <line x1="68" y1="-68" x2="88" y2="-88"/>
      <line x1="96" y1="0" x2="124" y2="0"/>
      <line x1="68" y1="68" x2="88" y2="88"/>
      <line x1="-68" y1="-68" x2="-88" y2="-88"/>
      <line x1="-96" y1="0" x2="-124" y2="0"/>
    </g>
  </g>

  <!-- Far ridge -->
  <path d="M0 372 C 220 316 360 344 520 318 C 700 288 840 330 1020 306
           C 1220 280 1380 322 1560 300 C 1740 278 1880 312 2000 300 L2000 650 L0 650 Z"
        fill="#a9d0b6"/>

  <!-- Middle hills -->
  <path d="M0 420 C 180 372 300 402 470 380 C 660 356 800 396 980 372
           C 1180 346 1340 388 1520 366 C 1720 342 1880 380 2000 368 L2000 650 L0 650 Z"
        fill="#3d9460"/>

  <!-- The headland, the darkest green of the wordmark -->
  <path d="M1180 402 C 1290 300 1400 268 1512 336 C 1600 390 1700 404 1820 392
           C 1900 384 1960 396 2000 404 L2000 650 L1180 650 Z"
        fill="#155830"/>

  <!-- Sea, tucked under the hills -->
  <path d="M1150 452 L2000 452 L2000 556 L1150 556 Z" fill="url(#water)"/>
  <g stroke="#dceaf4" stroke-width="7" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M1250 486 q 44 -20 88 0 q 44 20 88 0"/>
    <path d="M1520 512 q 44 -20 88 0 q 44 20 88 0"/>
    <path d="M1310 534 q 44 -20 88 0 q 44 20 88 0"/>
    <path d="M1720 480 q 44 -20 88 0 q 44 20 88 0"/>
  </g>

  <!-- Terraced fields -->
  <path d="M0 470 C 240 436 430 470 640 452 C 860 432 1000 466 1180 452 L1180 650 L0 650 Z"
        fill="url(#field)"/>
  <g stroke="#c9911a" stroke-width="5" opacity="0.5" fill="none">
    <path d="M0 524 C 240 494 440 524 650 508 C 850 492 1010 518 1180 506"/>
    <path d="M0 578 C 240 550 440 578 650 562 C 850 546 1010 572 1180 560"/>
  </g>

  <!-- Tilled earth, the mark's terracotta.
       This was a cradling hand, echoing the logo's. At the height this band
       actually renders on a phone it read as an orange blob cut off by the
       frame — the shape needs room the composition does not have. Soil carries
       the same colour and says something true about the same place. -->
  <path d="M0 588 C 260 566 470 590 690 574 C 900 558 1040 582 1180 572 L1180 650 L0 650 Z"
        fill="#c65d3b"/>
  <g stroke="#8a3c24" stroke-width="5" opacity="0.35" fill="none">
    <path d="M0 618 C 260 598 470 622 690 606 C 900 590 1040 614 1180 604"/>
  </g>

  <!-- Wheat, rooted in the field -->
  <g transform="translate(250 296)" fill="#e8ae1f">
    <rect x="-4" y="60" width="8" height="232" rx="4"/>
    <ellipse cx="-20" cy="70" rx="15" ry="26" transform="rotate(-24 -20 70)"/>
    <ellipse cx="20" cy="70" rx="15" ry="26" transform="rotate(24 20 70)"/>
    <ellipse cx="-20" cy="118" rx="15" ry="26" transform="rotate(-24 -20 118)"/>
    <ellipse cx="20" cy="118" rx="15" ry="26" transform="rotate(24 20 118)"/>
    <ellipse cx="0" cy="40" rx="15" ry="30"/>
  </g>
  <g transform="translate(330 330) scale(0.82)" fill="#f5d786">
    <rect x="-4" y="60" width="8" height="252" rx="4"/>
    <ellipse cx="-19" cy="74" rx="14" ry="25" transform="rotate(-24 -19 74)"/>
    <ellipse cx="19" cy="74" rx="14" ry="25" transform="rotate(24 19 74)"/>
    <ellipse cx="0" cy="44" rx="14" ry="29"/>
  </g>
  <g transform="translate(176 340) scale(0.74)" fill="#f5d786">
    <rect x="-4" y="60" width="8" height="256" rx="4"/>
    <ellipse cx="-19" cy="74" rx="14" ry="25" transform="rotate(-24 -19 74)"/>
    <ellipse cx="19" cy="74" rx="14" ry="25" transform="rotate(24 19 74)"/>
    <ellipse cx="0" cy="44" rx="14" ry="29"/>
  </g>

  <!-- Olive branch, the mark's own -->
  <g stroke="#114626" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M700 176 C 840 132 1000 140 1120 196"/>
  </g>
  <g fill="#1b6b3a">
    <ellipse cx="754" cy="140" rx="46" ry="24" transform="rotate(-28 754 140)"/>
    <ellipse cx="856" cy="122" rx="46" ry="24" transform="rotate(-14 856 122)"/>
    <ellipse cx="962" cy="130" rx="46" ry="24" transform="rotate(10 962 130)"/>
    <ellipse cx="1056" cy="160" rx="44" ry="23" transform="rotate(26 1056 160)"/>
    <ellipse cx="806" cy="212" rx="42" ry="22" transform="rotate(22 806 212)"/>
    <ellipse cx="912" cy="200" rx="42" ry="22" transform="rotate(-8 912 200)"/>
  </g>
  <g fill="#114626">
    <circle cx="866" cy="178" r="21"/>
    <circle cx="1002" cy="188" r="19"/>
  </g>
</svg>
