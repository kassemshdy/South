# Local development stack.
#   docker compose up
# The API serves on :8000 and the Vite dev server on :5173.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: south_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/south_dev
      SECRET_KEY: dev-insecure-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_OWNER_PASSWORD: DemoOwner!123
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe!123
      PUBLIC_BASE_URL: http://localhost:5173
      # In development the Vite server owns the frontend.
      FRONTEND_DIST_DIR: ""
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/var/media

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  media_data:
