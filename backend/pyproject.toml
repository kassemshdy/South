[project]
name = "south-directory-backend"
version = "1.0.0"
description = "Arabic-first business directory for South Lebanon"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends() in defaults is the documented pattern
  "RUF001",  # Arabic strings contain characters ruff flags as ambiguous
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["alembic/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
