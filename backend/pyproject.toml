[project]
name = "south-directory-backend"
version = "1.0.0"
description = "Arabic-first business directory for South Lebanon"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends() in defaults is the documented pattern
  "RUF001",  # Arabic strings contain characters ruff flags as ambiguous
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The per-worker database is chosen before the app is imported, because
# the engine reads DATABASE_URL once (see _own_database_per_worker).
"tests/conftest.py" = ["E501", "E402"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["alembic/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
# Every test here is a plain function, and the default `Test*` pattern makes
# pytest try to collect any imported model whose name happens to start with
# "Test" -- `Testimonial` and `TestimonialStatus` each produced a
# PytestCollectionWarning. Disabling class collection removes the noise
# rather than renaming domain objects around the test runner.
python_classes = []
