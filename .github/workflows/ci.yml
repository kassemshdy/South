name: CI

# Replaces the earlier node.js.yml, which ran `npm ci` at the repo root and
# would have failed immediately — there is no root package.json, the
# frontend lives in frontend/. This runs the actual local gate documented in
# AGENTS.md (backend pytest + ruff + mypy against a real Postgres, frontend
# tsc + build, the Playwright acceptance suite) and posts one summary comment on the pull request so a
# reviewer never has to click into a run to see whether it's green.

on:
  pull_request:
    branches: [develop-claude, master-claude]
  push:
    branches: [develop-claude, master-claude]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    # tests/test_spa.py skips itself unless frontend/dist/index.html exists,
    # so nine tests -- including the one asserting a traversal path cannot
    # escape the build directory -- never ran here at all. The backend job
    # does not build the frontend, so the guard was permanently inert.
    #
    # `needs` costs the frontend job's wall clock, and `always()` keeps a
    # frontend failure from silently cancelling the entire backend suite:
    # this job still runs, the download below is allowed to fail, and
    # test_spa returns to skipping rather than reporting a false red.
    needs: frontend
    if: always()
    # Surfaced in the pull request comment, so a reviewer sees the counts
    # without opening the run. See the `comment` job.
    outputs:
      tests: ${{ steps.pytest.outputs.summary }}
      failures: ${{ steps.pytest.outputs.failures }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: south_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --no-cache-dir -r requirements-dev.txt

      # Where test_spa.py looks for it: frontend/dist, relative to the repo
      # root. Allowed to fail -- if the frontend job did not produce a
      # bundle, those tests skip exactly as they did before.
      - name: Download the built frontend
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: pytest
        id: pytest
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/south_test
          SECRET_KEY: ci-test-secret-key
          STORAGE_LOCAL_DIR: var/test-media
        run: ../.github/scripts/run-pytest.sh ./.venv/bin/pytest tests/

      - name: ruff
        if: always()
        working-directory: backend
        run: ./.venv/bin/ruff check .

      - name: mypy
        if: always()
        working-directory: backend
        run: ./.venv/bin/mypy app scripts

  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: tsc -b
        working-directory: frontend
        run: npx tsc -b

      - name: build
        if: always()
        working-directory: frontend
        run: npm run build

      # The backend suite consumes this: see the `needs` comment above.
      # `always()` so a bundle that built despite a type error is still
      # available -- tsc failing already fails this job on its own.
      - name: Upload the built frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: warn

  mcp:
    name: MCP server (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pytest.outputs.summary }}
      failures: ${{ steps.pytest.outputs.failures }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Its own virtualenv, not the backend's: mcp requires pydantic>=2.12
      # while the backend pins 2.10.4, so a shared environment would upgrade
      # the API's own validation library. See docs/MCP.md.
      - name: Install dependencies
        working-directory: mcp-server
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --no-cache-dir -r requirements.txt
          ./.venv/bin/pip install --no-cache-dir ruff==0.8.4 mypy==1.14.0

      # No database and no API: the suite drives the tools through a mock
      # transport, so it needs no service container and no credentials.
      - name: pytest
        id: pytest
        working-directory: mcp-server
        run: ../.github/scripts/run-pytest.sh ./.venv/bin/pytest tests

      - name: ruff
        if: always()
        working-directory: mcp-server
        run: ./.venv/bin/ruff check .

      - name: mypy
        if: always()
        working-directory: mcp-server
        run: ./.venv/bin/mypy south_mcp

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The acceptance suite, against the real stack: a migrated and seeded
    # Postgres, the API on :8000 and Vite on :5173 proxying to it -- the same
    # layout AGENTS.md describes for running it by hand. It lives here so a
    # pull request is the one place it runs (issue #121), rather than every
    # development session paying eight minutes for it before each push.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: south_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The development defaults from backend/.env.example, which the specs
    # sign in with. SEED_OWNER_PASSWORD is the demo accounts' password and is
    # refused in production, so none of this is a secret.
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/south_dev
      SECRET_KEY: ci-e2e-secret-key
      PUBLIC_BASE_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: var/media
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe!123
      SEED_OWNER_PASSWORD: DemoOwner!123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --no-cache-dir -r requirements-dev.txt

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Migrate and seed
        working-directory: backend
        run: |
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/python -m scripts.seed --ensure

      - name: Start the API and Vite
        run: |
          mkdir -p logs
          (cd backend && nohup ./.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../logs/api.log 2>&1 &)
          (cd frontend && nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > ../logs/vite.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null \
              && curl -sf http://127.0.0.1:5173/ > /dev/null; then
              echo "Both up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Servers did not come up"; tail -50 logs/api.log logs/vite.log; exit 1

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      # Screenshots, traces and both server logs -- what a failure is
      # diagnosed from, since nobody re-runs this suite locally any more.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            logs
          retention-days: 7
          if-no-files-found: ignore

  comment:
    name: Post PR status comment
    needs: [backend, frontend, mcp, e2e]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        # Values arrive through `env`, never interpolated into the script
        # body. A ${{ }} expression pasted into JavaScript is a script
        # injection waiting for a test name or an assertion message that
        # contains a backtick — and those strings come from test files, which
        # anyone opening a pull request can write.
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_TESTS: ${{ needs.backend.outputs.tests }}
          BACKEND_FAILURES: ${{ needs.backend.outputs.failures }}
          MCP_RESULT: ${{ needs.mcp.result }}
          MCP_TESTS: ${{ needs.mcp.outputs.tests }}
          MCP_FAILURES: ${{ needs.mcp.outputs.failures }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const env = process.env
            const jobs = [
              {
                name: 'Backend (pytest, ruff, mypy)',
                result: env.BACKEND_RESULT,
                tests: env.BACKEND_TESTS,
                failures: env.BACKEND_FAILURES,
              },
              {
                name: 'MCP server (pytest, ruff, mypy)',
                result: env.MCP_RESULT,
                tests: env.MCP_TESTS,
                failures: env.MCP_FAILURES,
              },
              {
                name: 'Frontend (tsc, build)',
                result: env.FRONTEND_RESULT,
                // Typecheck and build only; the browser suite is its own
                // job, below.
                tests: 'typecheck + build',
                failures: '',
              },
              {
                name: 'E2E (Playwright)',
                result: env.E2E_RESULT,
                // Failure screenshots, traces and server logs are uploaded as
                // the run's e2e-results artifact.
                tests: 'acceptance suite, mobile Chromium',
                failures: '',
              },
            ]

            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌')
            const allGreen = jobs.every((j) => j.result === 'success')
            const marker = '<!-- ci-status-comment -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // A fenced block cannot be closed early by content that happens
            // to contain a fence, so any run of backticks is defanged before
            // it goes near one.
            const fence = (text) => '```\n' + text.replace(/`/g, "'") + '\n```'

            const lines = [
              marker,
              `## ${allGreen ? '✅ CI passed' : '❌ CI failed'}`,
              '',
              '| Check | Result | Tests |',
              '|---|---|---|',
              ...jobs.map(
                (j) => `| ${j.name} | ${icon(j.result)} ${j.result} | ${j.tests || '—'} |`,
              ),
            ]

            // Only when something failed: on a green run this section would
            // be an empty box a reviewer learns to scroll past.
            for (const job of jobs.filter((j) => (j.failures || '').trim())) {
              lines.push(
                '',
                `<details open><summary><strong>${job.name}</strong> — failing tests</summary>`,
                '',
                fence(job.failures.trim()),
                '</details>',
              )
            }

            lines.push('', `[View run](${runUrl})`)
            const body = lines.join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
