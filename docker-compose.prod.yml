# Self-hosted production stack for a VPS.
#   docker compose -f docker-compose.prod.yml up -d
# Caddy terminates TLS (automatic Let's Encrypt) and proxies to the app,
# which serves both the API and the built SPA from one image.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-south}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-south}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    volumes:
      - media_data:/app/var/media

  # Serves hashed /assets/* directly and proxies every other route to the
  # API — one public origin, so image URLs resolve and every page (not just
  # /business/*) gets its server-rendered SEO tags.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "8080"
      API_INTERNAL_HOST: api:8000

  # TLS termination in front of the web service.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
